name: OpenSidecar
options:
  createIntermediateGroups: true
# Swift Package Manager dependencies. Sparkle powers the macOS app's
# out-of-store auto-update (issue #52); it's an embedded open-source
# framework + CLI tooling, not a hosted service — the appcast feed and the
# DMG are served from infrastructure we already own (GitHub Pages + Releases).
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # 2.x is the current major (latest 2.9.x) and the first Sparkle line to
    # support SPM. `from:` allows compatible 2.x updates.
    from: "2.6.0"
schemes:
  OpenSidecarMac:
    build:
      targets:
        OpenSidecarMac: all
    test:
      targets:
        - OpenSidecarMacTests
  OpenSidecariOS:
    build:
      targets:
        OpenSidecariOS: all
  OpenSidecarMacReceiver:
    build:
      targets:
        OpenSidecarMacReceiver: all
# DEVELOPMENT_TEAM comes from the environment (see generate.sh / .env) so no
# personal team ID lives in the repo. Unset = unsigned, fine for CI.
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    # Version defaults for local builds. CI overrides both via xcargs:
    # MARKETING_VERSION from the release tag, CURRENT_PROJECT_VERSION from
    # the GitHub Actions run number (monotonic, keeps TestFlight builds unique).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OpenSidecarMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Mac
      - Shared
    dependencies:
      - package: Sparkle
    info:
      path: Mac/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSLocalNetworkUsageDescription: OpenDisplay connects to your iPad or iPhone over the local network in WiFi mode.
        NSBonjourServices: ["_opensidecar._tcp"]
        LSApplicationCategoryType: public.app-category.utilities
        # --- Sparkle auto-update (issue #52) ---
        # The appcast feed is hosted on the landing-page site at the custom
        # domain. The release workflow publishes appcast.xml so this URL
        # resolves — see .github/workflows/release.yml.
        SUFeedURL: https://opendisplay.app/appcast.xml
        # Public EdDSA key from Sparkle's `generate_keys`. The matching private
        # key lives only as the `SPARKLE_PRIVATE_KEY` GitHub Actions secret
        # (used to sign the appcast in CI) and is never committed. Sparkle
        # verifies update signatures against this public key before installing.
        SUPublicEDKey: rYxlIePmwzi2bRo/qIsuY2TqTnQ34li2gQhJpGBiumw=
        # --- alfheim fork: auto-update off ---
        # There is no appcast for this fork's identity, and the upstream feed
        # above advertises the *stock* app: a background check would offer to
        # replace the fork with upstream 1.19.0 and silently undo every feature
        # in this branch. Turning scheduled checks off is half of the fix; the
        # other half is `startingUpdater: false` in Mac/OpenSidecarMacApp.swift,
        # which keeps Sparkle from running at all. The SUFeedURL and
        # SUPublicEDKey keys stay so Sparkle still has a well-formed
        # configuration if it is ever started again.
        SUEnableAutomaticChecks: false
    settings:
      base:
        # --- alfheim fork identity ---
        # Its own bundle id and product name so the fork coexists with the
        # stock App Store / DMG builds instead of fighting them:
        #   * TCC keys Screen Recording and Accessibility grants by bundle id
        #     + code signature, so sharing an id would revoke the stock app's
        #     permissions every time this binary is rebuilt;
        #   * UserDefaults domain becomes com.peetzweg.opensidecar.mac.alfheim
        #     (`defaults write com.peetzweg.opensidecar.mac.alfheim …`);
        #   * Log.swift derives its folder from CFBundleName, i.e. PRODUCT_NAME,
        #     so this build logs to ~/Library/Logs/OpenDisplay Alfheim;
        #   * PRODUCT_NAME (not BUNDLE_DISPLAY_NAME) is what the permission
        #     lists show, so the fork appears as its own row.
        PRODUCT_BUNDLE_IDENTIFIER: com.peetzweg.opensidecar.mac.alfheim
        PRODUCT_NAME: OpenDisplay Alfheim
        BUNDLE_DISPLAY_NAME: OpenDisplay Alfheim
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Mac/OpenSidecarMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Local dev builds get their own identity: TCC keys permission
        # grants by bundle ID + code signature, so a Debug build sharing
        # the release bundle ID knocks out the release app's Screen
        # Recording/Accessibility grants every time the binary changes.
        # PRODUCT_NAME (not BUNDLE_DISPLAY_NAME) is what the permission
        # lists show, so the Debug build must override it to appear as its
        # own row instead of a second, indistinguishable "OpenDisplay".
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.peetzweg.opensidecar.mac.alfheim.debug
          PRODUCT_NAME: OpenDisplay Alfheim Dev
          BUNDLE_DISPLAY_NAME: OpenDisplay Alfheim Dev
          # Colour-inverted icon so the dev build is obvious in the Dock,
          # cmd-tab and permission lists.
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
  # The standalone receiver app (issues #82/#17/#241): a spare Mac as a
  # display. Deliberately its own bundle with a much lower deployment target
  # than the sender, which is pinned to 14 by its capture stack. Everything
  # under Shared/ and the files listed from Mac/ must therefore compile at
  # this floor; keep this the oldest macOS the receiver path supports.
  OpenSidecarMacReceiver:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - MacReceiver
      - Shared
      - Mac/Log.swift
      - Mac/LogPolicies.swift
      - Mac/CheckForUpdatesView.swift
    dependencies:
      - package: Sparkle
    info:
      path: MacReceiver/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: OpenDisplay Receiver advertises itself on the local network so another Mac can connect and use this Mac as a display.
        NSBonjourServices: ["_opensidecar._tcp"]
        LSApplicationCategoryType: public.app-category.utilities
        # Own Sparkle feed (separate DMG, same signing key); published by
        # release.yml next to the sender's appcast.
        SUFeedURL: https://opendisplay.app/appcast-receiver.xml
        SUPublicEDKey: rYxlIePmwzi2bRo/qIsuY2TqTnQ34li2gQhJpGBiumw=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peetzweg.opensidecar.mac.receiver
        PRODUCT_NAME: OpenDisplay Receiver
        BUNDLE_DISPLAY_NAME: OpenDisplay Receiver
        # Log.swift's file locking helpers live in the C bridging header.
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: MacReceiver/OpenSidecarMacReceiver.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.peetzweg.opensidecar.mac.receiver.debug
          PRODUCT_NAME: OpenDisplay Receiver Dev
          BUNDLE_DISPLAY_NAME: OpenDisplay Receiver Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
  OpenSidecarMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - MacTests
      - Mac/DisplayArrangement.swift
      - Mac/FrameRate.swift
      - Mac/InputInjector.swift
      - Mac/KeyboardMap.swift
      - Mac/KeyRemapPlan.swift
      - Mac/InputSource.swift
      - Mac/KeyRepeat.swift
      - Mac/Log.swift
      - Mac/LogPolicies.swift
      - Shared/Protocol.swift
      - Shared/LogSnapshot.swift
      - Shared/FrameCodec.swift
      - Shared/AudioPacket.swift
      - Shared/AudioJitterBuffer.swift
      # The player itself, for the graph invariant: exactly one AVAudioPlayerNode
      # with exactly one connection point, asserted against a real AVAudioEngine
      # (AudioGraphTests). No audio device is needed — the graph exists before
      # anything is started.
      - Shared/AudioPlayer.swift
      - Mac/AudioPolicy.swift
      - Mac/AdaptiveQuality.swift
      # The pure halves of the virtual-display lifetime: the HiDPI enforcement
      # state machine and the registry that owns every CGVirtualDisplay. Neither
      # touches CoreGraphics, so the release path is testable without a display.
      - Mac/DisplayLifecycle.swift
      - Mac/VideoSendQueue.swift
      - Shared/StatsChannel.swift
      - Mac/SessionDedupe.swift
      # Pure: how often a dial that cannot reach its receiver may say so.
      - Shared/RedialLog.swift
      - Mac/SessionLayout.swift
      - Mac/WindowGather.swift
      - Shared/SenderIdentity.swift
      # Pure, UIKit-free: the Native-mode gesture decisions (iOS), tested here.
      - iOS/NativeTouchPolicy.swift
      - MacReceiver/FullscreenPreference.swift
    settings:
      base:
        # A hostless test bundle: the sources under test are compiled straight
        # into it, so there is no app to inject into and nothing to load from.
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        # Without this the bundle has no Info.plist and code signing refuses to
        # run, which fails the build before a single test executes.
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
  OpenSidecariOS:
    type: application
    platform: iOS
    # Upstream lowered this to 15.0 in v1.21.0 to revive iPad Air 2 / mini 4 /
    # iPhone 6s-era hardware (#72), using #available for anything newer. The
    # fork ships to exactly one receiver — an iPad Pro 11 M1 on current
    # iPadOS — and its UI uses iOS 16 API directly (LabeledContent), so the
    # fork keeps its own floor instead of rewriting that behind #available.
    deploymentTarget: "16.4"
    sources:
      - iOS
      - Shared
    info:
      path: iOS/Info.plist
      properties:
        # alfheim fork: own display name so it is distinguishable from the
        # App Store build on the same iPad's home screen.
        CFBundleDisplayName: OpenDisplay Alfheim
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        # ProMotion. Since iOS 15 a third-party app is held to a 60 Hz minimum
        # frame duration unless it declares this key — Apple's "Optimizing
        # ProMotion Refresh Rates for iPhone 13 Pro and iPad Pro" is the
        # reference, and despite the "OnPhone" spelling it is the documented
        # opt-in for the whole high-refresh behaviour. Declaring it on a
        # 60 Hz device changes nothing, so there is no downside to setting it
        # unconditionally.
        #
        # Without it the CAMetalLayer path (and Core Animation generally)
        # presents at most 60 times a second, which would silently throw away
        # half of a 120 fps stream at the last step of the pipeline. Verify on
        # the device with the performance overlay's FPS readout and the
        # `panel: …Hz max` line this app logs at startup.
        CADisableMinimumFrameDurationOnPhone: true
        NSLocalNetworkUsageDescription: OpenDisplay advertises itself on the local network so your Mac can connect over WiFi.
        NSBonjourServices: ["_opensidecar._tcp"]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        # alfheim fork: own bundle id, so this installs alongside the stock
        # App Store receiver rather than replacing it. The stock app stays
        # available as the fallback for the live production session.
        PRODUCT_BUNDLE_IDENTIFIER: com.peetzweg.opensidecar.ios.alfheim
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
